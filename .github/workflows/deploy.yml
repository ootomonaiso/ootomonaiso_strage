name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build Docusaurus Site and Generate Candidate Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.11.0'

      - name: Clear npm cache
        working-directory: website
        run: npm cache clean --force

      - name: Remove Docusaurus cache
        working-directory: website
        run: rm -rf .docusaurus

      - name: Install dependencies
        working-directory: website
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1
        run: npm ci

      - name: Clear Docusaurus cache again
        working-directory: website
        run: npm run clear

      - name: Inject env vars for frontend
        working-directory: website
        run: |
          echo "REACT_APP_GEMINI_API_KEY=${{ secrets.REACT_APP_GEMINI_API_KEY }}" > .env
          echo "REACT_APP_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "REACT_APP_SUPABASE_ANON_KEY=${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}" >> .env
          echo "DOCSEARCH_APP_ID=${{ secrets.DOCSEARCH_APP_ID }}" >> .env
          echo "DOCSEARCH_API_KEY=${{ secrets.DOCSEARCH_API_KEY }}" >> .env
          echo "DOCSEARCH_INDEX_NAME=${{ secrets.DOCSEARCH_INDEX_NAME }}" >> .env

      - name: Build Docusaurus site
        working-directory: website
        run: npm run build

      - name: Generate candidate links
        working-directory: website
        run: node generate_candidate_links.mjs

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-and-vectorize:
    name: Notify Discord & Vectorize Docs
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Checkout manifest history branch
        uses: actions/checkout@v3
        with:
          ref: docs-manifest-history
          path: manifest-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy previous manifest
        run: |
          if [ -f manifest-repo/docs-manifest.yml ]; then
            cp manifest-repo/docs-manifest.yml script/docs-manifest.yml
            echo "✅ 前回のマニフェストを取得しました"
          else
            echo "⚠️ マニフェストが存在しません（初回実行）"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.11.0'

      - name: Install dependencies
        working-directory: script
        run: npm ci

      - name: Run notify and vectorize script
        working-directory: script
        env:
          SITE_URL: 'https://ootomonaiso.github.io/ootomonaiso_strage/'
        run: node notify-and-vectorize.mjs

      - name: Commit and push manifest to history branch
        if: env.DOC_MSG != '' && env.DOC_MSG != '更新されたドキュメントはありません。'
        run: |
          cd manifest-repo
          cp ../script/docs-manifest.yml .

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs-manifest.yml
          git commit -m "📝 Update manifest: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || echo "変更なし"
          git push origin docs-manifest-history

          echo "✅ マニフェストを docs-manifest-history ブランチに保存しました"

      - name: Send Discord notification
        if: env.DOC_MSG != '' && env.DOC_MSG != '更新されたドキュメントはありません。'
        run: |
          echo "Sending Discord notification..."
          CONTENT=":tada: **サイトが更新されました！** :tada:

          更新されたページ:

          ${DOC_MSG}

          サイト: <https://ootomonaiso.github.io/ootomonaiso_strage/>"

          jq -n --arg content "$CONTENT" '{content: $content}' | \
          curl -X POST -H "Content-Type: application/json" \
            -d @- \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
